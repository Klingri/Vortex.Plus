name: Create Release Zip

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build and Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Zip Folder
        run: |
          zip -r VortexPro.zip . -x "*.git*" "-x .github*" "-x VortexPro.zip"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: VortexPro.zip
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: false
