<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VortexPro Settings</title>
    <link rel="stylesheet" href="options.css">
</head>

<body>
    <div id="container">
        <aside>
            <ul>
                <li>
                    <button class="nav-button active">Management</button>
                    <input type="text" placeholder="Search feature" class="nav-input">
                    <button class="nav-button">Home</button>
                    <button class="nav-button">Games</button>
                    <button class="nav-button">Users</button>
                    <button class="nav-button">Groups</button>
                    <button class="nav-button">Items</button>
                    <button class="nav-button">Avatar</button>
                    <button class="nav-button">Navigation</button>
                    <button class="nav-button">Account</button>
                    <button class="nav-button">Notifications</button>
                    <button class="nav-button">Miscellaneous</button>
                    <button class="nav-button">Developers</button>
                    <input type="button" class="nav-input blocked-btn" value="Blocked Items">
                </li>
            </ul>
        </aside>

        <main class="main-container">
            <h1 class="title-text">Vortex Pro Settings & Tweaks</h1>
            <div class="linebreaker"></div>

            <!-- Setting Item 1: Simple Toggle -->
            <div class="setting-item">
                <div class="setting-details">
                    <h3 class="text-settings">Enable Dark Mode</h3>
                    <p class="setting-desc">Switch between light and dark themes.</p>
                </div>
                <label class="switch">
                    <input type="checkbox" checked>
                    <span class="slider"></span>
                </label>
            </div>

            <div class="linebreaker"></div>

            <!-- Setting Item 2: Another Toggle -->
            <div class="setting-item">
                <div class="setting-details">
                    <h3 class="text-settings">Auto-Update</h3>
                    <p class="setting-desc">Keep the app on the latest version.</p>
                </div>
                <label class="switch">
                    <input type="checkbox">
                    <span class="slider"></span>
                </label>
            </div>

            <div class="linebreaker"></div>
        </main>
    </div>
</body>

</html>
